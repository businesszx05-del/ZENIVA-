<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zeniva - Admin Panel</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        ::-webkit-scrollbar {
            display: none;
        }
    </style>
</head>
<body class="p-4 max-w-md mx-auto">

    <!-- Header -->
    <div class="flex justify-between items-center mb-6 pt-2">
        <h1 class="text-xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-purple-400 to-pink-500">Admin Dashboard</h1>
        <a href="index.html" class="text-xs bg-slate-800 text-slate-300 px-3 py-1.5 rounded-full border border-slate-700 hover:bg-slate-700 transition">
            <i class="fa-solid fa-arrow-left mr-1"></i> Back to App
        </a>
    </div>

    <!-- Login Box -->
    <div id="loginSection" class="bg-slate-900 border border-slate-800 p-5 rounded-2xl shadow-xl">
        <h2 class="text-sm font-semibold text-slate-300 mb-3"><i class="fa-solid fa-lock text-purple-400 mr-2"></i> Enter Admin Password</h2>
        <input type="password" id="adminPass" placeholder="Enter password (123)" 
            class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-sm mb-3 focus:outline-none focus:border-purple-500">
        <button onclick="checkLogin()" class="w-full bg-purple-600 hover:bg-purple-500 text-white py-3 rounded-xl text-sm font-semibold transition">
            Login
        </button>
    </div>

    <!-- Admin Panel Content (Hidden initially) -->
    <div id="adminPanel" class="hidden space-y-6">
        <!-- Add Item Form -->
        <div class="bg-slate-900 border border-slate-800 p-5 rounded-2xl shadow-xl">
            <h2 class="text-sm font-bold text-purple-400 mb-4 uppercase tracking-wider">Add New Asset</h2>
            
            <div class="space-y-3">
                <div>
                    <label class="text-xs text-slate-400 mb-1 block">Item Title</label>
                    <input type="text" id="itemTitle" placeholder="e.g. Funny Cat Sticker" 
                        class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-sm focus:outline-none focus:border-purple-500">
                </div>

                <div>
                    <label class="text-xs text-slate-400 mb-1 block">Select Category</label>
                    <select id="itemCategory" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-sm focus:outline-none focus:border-purple-500 text-slate-200">
                        <option value="wallpapers">Wallpaper (9:16)</option>
                        <option value="stickers">Sticker (.webp)</option>
                        <option value="dps">WhatsApp DP</option>
                        <option value="wishes">Wish Card</option>
                    </select>
                </div>

                <div>
                    <label class="text-xs text-slate-400 mb-1 block">GitHub Direct / Raw Image URL</label>
                    <input type="text" id="itemUrl" placeholder="https://raw.githubusercontent.com/..." 
                        class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-sm focus:outline-none focus:border-purple-500">
                </div>

                <button onclick="addItem()" class="w-full bg-gradient-to-r from-purple-600 to-pink-600 hover:from-purple-500 hover:to-pink-500 text-white py-3 rounded-xl text-sm font-semibold transition shadow-lg shadow-purple-900/40">
                    Add to Live App
                </button>
            </div>
        </div>

        <!-- Manage / Delete Existing Custom Items -->
        <div class="bg-slate-900 border border-slate-800 p-5 rounded-2xl shadow-xl">
            <h2 class="text-sm font-bold text-slate-400 mb-4 uppercase tracking-wider">Manage Uploaded Items</h2>
            <div id="manageList" class="space-y-2 max-h-60 overflow-y-auto">
                <!-- Dynamic custom items list -->
            </div>
        </div>
    </div>

    <script>
        function checkLogin() {
            const pass = document.getElementById('adminPass').value;
            if(pass === '123') {
                document.getElementById('loginSection').classList.add('hidden');
                document.getElementById('adminPanel').classList.remove('hidden');
                loadManageList();
            } else {
                alert('Wrong Password! Use 123');
            }
        }

        function addItem() {
            let title = document.getElementById('itemTitle').value.trim();
            let category = document.getElementById('itemCategory').value;
            let url = document.getElementById('itemUrl').value.trim();

            if(!title || !url) {
                alert('Please fill in all fields!');
                return;
            }

            let newItem = { title, category, url };
            let customItems = JSON.parse(localStorage.getItem('zeniva_admin_items')) || [];
            
            // Naya item list mein sab se upar add hoga
            customItems.unshift(newItem);
            localStorage.setItem('zeniva_admin_items', JSON.stringify(customItems));

            alert('Successfully Added to Live App!');
            document.getElementById('itemTitle').value = '';
            document.getElementById('itemUrl').value = '';
            loadManageList();
        }

        function loadManageList() {
            let listContainer = document.getElementById('manageList');
            let customItems = JSON.parse(localStorage.getItem('zeniva_admin_items')) || [];
            
            listContainer.innerHTML = '';

            if(customItems.length === 0) {
                listContainer.innerHTML = `<p class="text-xs text-slate-500 text-center py-4">No custom items uploaded yet.</p>`;
                return;
            }

            customItems.forEach((item, index) => {
                let row = document.createElement('div');
                row.className = 'flex items-center justify-between bg-slate-950 p-2.5 rounded-xl border border-slate-800/80';
                row.innerHTML = `
                    <div class="flex items-center gap-3 overflow-hidden">
                        <img src="${item.url}" class="w-9 h-9 object-cover rounded-lg bg-slate-900 flex-shrink-0">
                        <div class="overflow-hidden">
                            <p class="text-xs font-medium text-slate-200 truncate">${item.title}</p>
                            <span class="text-[9px] text-purple-400 uppercase">${item.category}</span>
                        </div>
                    </div>
                    <button onclick="deleteItem(${index})" class="bg-red-500/20 text-red-400 hover:bg-red-500 hover:text-white px-2.5 py-1.5 rounded-lg text-xs font-semibold transition">
                        <i class="fa-solid fa-trash"></i>
                    </button>
                `;
                listContainer.appendChild(row);
            });
        }

        function deleteItem(index) {
            if(confirm('Are you sure you want to delete this item?')) {
                let customItems = JSON.parse(localStorage.getItem('zeniva_admin_items')) || [];
                customItems.splice(index, 1); // List se item nikal diya
                localStorage.setItem('zeniva_admin_items', JSON.stringify(customItems));
                loadManageList(); // List dubara refresh hogi
                alert('Item deleted successfully!');
            }
        }
    </script>
</body>
</html>
