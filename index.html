<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Innovate - Premium Animation Experience</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div id="scene-container">
        <!-- SCENE 1: INTRO -->
        <div class="scene" id="scene1">
            <div class="scene-bg"></div>
            <div class="decorative-shape shape1"></div>
            <div class="decorative-shape shape2"></div>
            <div class="decorative-shape shape3"></div>
            <div class="content">
                <h1 class="main-heading">INNOVATE</h1>
                <p class="subtitle">Transforming Ideas into Reality</p>
            </div>
        </div>

        <!-- SCENE 2: MAIN VISUAL -->
        <div class="scene" id="scene2">
            <div class="scene-bg"></div>
            <div class="card card1">
                <div class="card-icon">🎨</div>
                <h3>Design</h3>
                <p>Crafting beautiful experiences</p>
            </div>
            <div class="card card2">
                <div class="card-icon">💻</div>
                <h3>Develop</h3>
                <p>Building robust solutions</p>
            </div>
            <div class="card card3">
                <div class="card-icon">🚀</div>
                <h3>Deploy</h3>
                <p>Launching with confidence</p>
            </div>
            <div class="card card4">
                <div class="card-icon">📈</div>
                <h3>Scale</h3>
                <p>Growing without limits</p>
            </div>
        </div>

        <!-- SCENE 3: INTERACTION -->
        <div class="scene" id="scene3">
            <div class="scene-bg"></div>
            <div class="connection-container">
                <svg class="connection-svg" viewBox="0 0 1000 1000" preserveAspectRatio="xMidYMid meet">
                    <line class="line line1" x1="500" y1="500" x2="500" y2="150"/>
                    <line class="line line2" x1="500" y1="500" x2="850" y2="500"/>
                    <line class="line line3" x1="500" y1="500" x2="500" y2="850"/>
                    <line class="line line4" x1="500" y1="500" x2="150" y2="500"/>
                </svg>
                <div class="central-node">
                    <div class="node-icon">✨</div>
                </div>
                <div class="orbit-node node1">
                    <div class="node-icon">🎨</div>
                </div>
                <div class="orbit-node node2">
                    <div class="node-icon">💻</div>
                </div>
                <div class="orbit-node node3">
                    <div class="node-icon">🚀</div>
                </div>
                <div class="orbit-node node4">
                    <div class="node-icon">📈</div>
                </div>
                <div class="particle particle1"></div>
                <div class="particle particle2"></div>
                <div class="particle particle3"></div>
                <div class="particle particle4"></div>
            </div>
        </div>

        <!-- SCENE 4: TRANSFORMATION -->
        <div class="scene" id="scene4">
            <div class="scene-bg"></div>
            <div class="transformation-container">
                <div class="central-glow"></div>
                <div class="central-object">
                    <h2>INNOVATE</h2>
                </div>
                <div class="orbiting-object obj1">
                    <span>🎨</span>
                </div>
                <div class="orbiting-object obj2">
                    <span>💻</span>
                </div>
                <div class="orbiting-object obj3">
                    <span>🚀</span>
                </div>
                <div class="orbiting-object obj4">
                    <span>📈</span>
                </div>
            </div>
        </div>

        <!-- SCENE 5: FINAL -->
        <div class="scene" id="scene5">
            <div class="scene-bg"></div>
            <div class="final-container">
                <div class="particle-bg">
                    <div class="floating-particle p1"></div>
                    <div class="floating-particle p2"></div>
                    <div class="floating-particle p3"></div>
                    <div class="floating-particle p4"></div>
                    <div class="floating-particle p5"></div>
                    <div class="floating-particle p6"></div>
                </div>
                <div class="final-content">
                    <h1 class="final-title">INNOVATE</h1>
                    <p class="final-subtitle">The Future is Now</p>
                    <a href="#" class="cta-button">Get Started</a>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
